<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your language goal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="step-2.css">
    <script src="script-2.js" defer></script>
    <title>Konfide - Onboarding</title>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="/onboarding/step-1/" class="part-1">
                <img src="https://www.svgrepo.com/show/520523/arrow-left-5.svg" alt="return arrow">
                <p>ONBOARDING - Step 2 of 3</p>
            </a>
            <div class="part-2">
                <img src="https://www.svgrepo.com/show/525081/sun-2.svg" alt="theme-toggle">
            </div>
        </div>
        <div class="header-bottom">
            <hr class="completed"><hr class="uncomplete">
        </div>
    </header>
    <main>
        <b>What is your language goal?</b>
        <section class="cards">
            <section class="card" id="explore">
                <img src="/images/Onboarding-ball.svg" alt="Ball icon">
                <div class="card-text">
                    <b>explore</b>
                    <p>travel &#183; people &#183; fun</p>
                </div>
            </section>
            <section class="card" id="grow">
                <img src="/images/onboarding-book.svg" alt="Book icon">
                <div class="card-text">
                    <b>grow</b>
                    <p>work &#183; school &#183; certificates</p>
                </div>
            </section>
        </section>
        <a href="/onboarding/step-3/" class="continue-button">continue</a>
    </main>
    <footer>
        <small>&#169; Copyright - Konfide 2026</small>
    </footer>
</body>
</html>
