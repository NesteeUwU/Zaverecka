<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="step-1.css">
    <title>Konfide - Onboarding</title>
</head>
<body>
    <header>
        <div class="header-top">
            <img src="https://www.svgrepo.com/show/520523/arrow-left-5.svg" alt="return arrow">
            <p>ONBOARDING - Step 1 of 3</p>
            <img src="" alt="">
            <img src="https://www.svgrepo.com/show/525081/sun-2.svg" alt="theme-toggle">
        </div>
        <div class="header-bottom">
            <hr class="completed"><hr class="uncomplete">
        </div>
    </header>
    <main>
        <b>What language do you want to learn?</b>
        <section class="cards">
            <section class="card">
                <img src="https://flagicons.lipis.dev/flags/4x3/jp.svg" alt="Japanese flag">
                <div class="card-text">
                    <b>japanese</b>
                    <p>writing &#8321; pronunciation &#8321; listening</p>
                </div>
            </section>
            <section class="card">
                <img src="https://flagicons.lipis.dev/flags/4x3/gb.svg" alt="United Kingdom flag">
                <div class="card-text">
                    <b>english</b>
                    <p>spelling &#8321; pronunciation &#8321; grammar</p>
                </div>
            </section>
            <section class="card">
                <img src="https://flagicons.lipis.dev/flags/4x3/de.svg" alt="German flag">
                <div class="card-text">
                    <b>german</b>
                    <p>spelling &#8321; pronunciation &#8321; grammar</p>
                </div>
            </section>
        </section>
        <a href="#" class="continue-button">continue</a>
    </main>
    <footer>
        <small>&#169; Copyright - Konfide 2026</small>
    </footer>
</body>
</html>
