<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your language proficiency">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="step-3.css">
    <script src="script-3.js" defer></script>
    <title>Konfide - Onboarding</title>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="/onboarding/step-2/step-2.html" class="part-1">
                <img src="https://www.svgrepo.com/show/520523/arrow-left-5.svg" alt="return arrow">
                <p>ONBOARDING - Step 3 of 3</p>
            </a>
            <div class="part-2">
                <img src="https://www.svgrepo.com/show/525081/sun-2.svg" alt="theme-toggle">
            </div>
        </div>
        <div class="header-bottom">
            <hr class="completed">
        </div>
    </header>
    <main>
        <b>What is your language proficiency?</b>
        <section class="cards">
            <section class="card">
                <img src="/images/newbie-v2.svg" alt="proficiency bar-newbie">
                <div class="card-text">
                    <b>newbie</b>
                    <p>You're just getting started</p>
                </div>
            </section>
            <section class="card">
                <img src="/images/beginner-v2.svg" alt="proficiency bar-beginner">
                <div class="card-text">
                    <b>beginner</b>
                    <p>You already know some words</p>
                </div>
            </section>
            <section class="card">
                <img src="/images/advanced-v2.svg" alt="proficiency bar-advanced">
                <div class="card-text">
                    <b>advanced</b>
                    <p>You can hold a basic conversation</p>
                </div>
            </section>
            <section class="card">
                <img src="/images/expert-v2.svg" alt="proficiency bar-expert">
                <div class="card-text">
                    <b>expert</b>
                    <p>You can speak freely</p>
                </div>
            </section>
        </section>
        <a href="/dashboard/home/home.html" class="continue-button">finish</a>
    </main>
    <footer>
        <small>&#169; Copyright - Konfide 2026</small>
    </footer>
</body>
</html>
