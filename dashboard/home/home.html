<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The home page of Konfide. Do a new lesson or explore the app.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="home.css">
    <title>Konfide - Home</title>
</head>
<body>
    <article class="container">
        <section class="sidebar">
            <div class="top">
                <b>Konfide</b>
                <img src="" alt="back-arrow">
            </div>
            <section class="crossroad">
                <a href="home.html"></a>
                <a href="/dashboard/lessons/lesson-board.html"></a>
                <a href="/dashboard/vocabulary/vocabulary.html"></a>
            </section>
            <section class="stats">
                <div class="streak">
                    <img src="" alt="fireee">
                    <p></p>
                </div>
                <hr>
                <div class="time">
                    <img src="" alt="clock">
                    <p></p>
                </div>
            </section>
            <section class="user">
                <div class="user-info">
                    <img src="" alt="profile picture">
                    <div class="username">
                        <b></b>
                        <p></p>
                    </div>
                    <img src="https://www.svgrepo.com/show/525081/sun-2.svg" alt="theme-toggle">
                </div>
                <hr>
                <div class="settings">
                    <img src="" alt="settings icon">
                    <a href="">settings</a>
                </div>
                <div class="support">
                    <img src="" alt="question icon">
                    <a href="">support</a>
                </div>
            </section>
        </section>
        <section class="main">
            <section class="welcome">

            </section>
            <section class="previous-lessons">
                <section class="recap">

                </section>
                <section class="lesson-graph">
                    
                </section>
            </section>
        </section>
    </article>
</body>
</html>
